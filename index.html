<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Hindi vocabulary list with English meanings and frequency ratings.">
  <title>Hindi Vocab</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='central' font-family='sans-serif' font-weight='bold' font-size='36' fill='%23ffffff'%3E%E0%A4%85%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Design tokens ---------- */
    /* Light is the default theme */
    :root {
      /* Palette: pure black, pure white, and one grey */
      --bg: #ffffff;
      --surface: #ffffff;
      --panel: #e5e5e5;
      --ink: #000000;
      --muted: #000000;
      --line: #e5e5e5;
      --line-strong: #000000;
      --head: #000000;
      --head-ink: #ffffff;
      --accent: #000000;
      --meter-track: #e5e5e5;
      --meter-fill: #000000;
      --zebra: #ffffff;
      --hover: #e5e5e5;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.08);

      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: "Newsreader", Georgia, "Times New Roman", serif;
      --font-hi: "Noto Sans Devanagari", "Nirmala UI", "Mangal", "Lohit Devanagari", sans-serif;

      /* Theme switch */
      --switch-track: #e5e5e5;
      --switch-border: #000000;
      --switch-knob: #000000;
      --switch-knob-shadow: rgba(0, 0, 0, 0.25);
      --switch-icon: #ffffff;

      /* Selection & control buttons */
      --seen-bg: #eaeaea;
      --seen-indicator: #000000;
      --control-btn-bg: rgba(255, 255, 255, 0.12);
      --control-btn-hover: rgba(255, 255, 255, 0.22);
      --control-btn-border: rgba(255, 255, 255, 0.28);
      --control-btn-ink: #ffffff;
      --control-btn-active-bg: #ffffff;
      --control-btn-active-ink: #000000;

      --radius: 14px;
      --title-h: 56px;
    }

    /* Dark theme, enabled only when the toggle sets data-theme="dark" */
    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: #000000;
      --panel: #262626;
      --ink: #ffffff;
      --muted: #ffffff;
      --line: #262626;
      --line-strong: #ffffff;
      --head: #000000;
      --head-ink: #ffffff;
      --accent: #ffffff;
      --meter-track: #262626;
      --meter-fill: #ffffff;
      --zebra: #000000;
      --hover: #262626;
      --shadow: 0 1px 2px rgba(255, 255, 255, 0.06);

      --switch-track: #262626;
      --switch-border: #ffffff;
      --switch-knob: #ffffff;
      --switch-knob-shadow: rgba(255, 255, 255, 0.2);
      --switch-icon: #000000;

      --seen-bg: #1c1c1c;
      --seen-indicator: #ffffff;
      --control-btn-bg: rgba(255, 255, 255, 0.1);
      --control-btn-hover: rgba(255, 255, 255, 0.2);
      --control-btn-border: rgba(255, 255, 255, 0.25);
      --control-btn-ink: #ffffff;
      --control-btn-active-bg: #ffffff;
      --control-btn-active-ink: #000000;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 0 0 max(32px, env(safe-area-inset-bottom));
    }

    .page {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 12px 0;
    }

    @media (min-width: 640px) {
      .page { padding: 40px 24px 0; }
    }

    /* ---------- Table card ---------- */
    .vocab {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
    }

    /* Title bar: sticky at the top of the viewport */
    .vocab .title-row th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--title-h);
      padding: 0 20px;
      background: var(--head);
      color: var(--head-ink);
      border-radius: 0;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 1rem + 1vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .title-row .title-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-row .title-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-tools {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-tool {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 28px;
      padding: 0 9px;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      background: var(--control-btn-bg);
      color: var(--control-btn-ink);
      border: 1px solid var(--control-btn-border);
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-tool:hover {
      background: var(--control-btn-hover);
      border-color: var(--control-btn-ink);
    }

    .btn-tool:active {
      transform: scale(0.97);
    }

    .btn-tool.is-hidden {
      background: var(--control-btn-active-bg);
      color: var(--control-btn-active-ink);
      border-color: var(--control-btn-active-bg);
    }

    .btn-tool svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
    }

    .btn-icon-only {
      width: 28px;
      padding: 0;
    }

    .seen-stats {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      color: color-mix(in srgb, var(--head-ink) 75%, transparent);
      white-space: nowrap;
      user-select: none;
    }

    /* Column visibility toggles */
    :root[data-hide-hi="true"] th.col-hi,
    :root[data-hide-hi="true"] td.cell-hi {
      display: none !important;
    }

    :root[data-hide-en="true"] th.col-en,
    :root[data-hide-en="true"] td.cell-en {
      display: none !important;
    }

    /* Row selection / seen styling */
    .vocab tbody tr {
      cursor: pointer;
      user-select: text;
    }

    .vocab tbody tr.is-seen td {
      background: var(--seen-bg);
      color: color-mix(in srgb, var(--ink) 65%, transparent);
    }

    .vocab tbody tr.is-seen:hover td {
      background: var(--hover);
      color: var(--ink);
    }

    .vocab tbody tr.is-seen td.cell-hi {
      color: color-mix(in srgb, var(--ink) 70%, transparent);
    }

    .vocab tbody tr.is-seen td.cell-no {
      font-weight: 600;
      position: relative;
    }

    .vocab tbody tr.is-seen td.cell-no::before {
      content: "✓ ";
      color: var(--seen-indicator);
      font-weight: bold;
    }

    /* ---------- Theme switch ---------- */
    .theme-toggle {
      appearance: none;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      border-radius: 999px;
      -webkit-tap-highlight-color: transparent;
      display: inline-flex;
      align-items: center;
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .switch-track {
      --w: 52px;
      --knob: 22px;
      --gap: 2px;
      --travel: calc(var(--w) - var(--knob) - var(--gap) * 2 - 2px);
      position: relative;
      display: block;
      width: var(--w);
      height: 28px;
      border-radius: 999px;
      background: var(--switch-track);
      border: 1px solid var(--switch-border);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    .theme-toggle:hover .switch-track {
      border-color: var(--switch-knob);
    }

    .switch-knob {
      position: absolute;
      top: 50%;
      left: var(--gap);
      width: var(--knob);
      height: var(--knob);
      margin-top: calc(var(--knob) / -2);
      border-radius: 50%;
      background: var(--switch-knob);
      box-shadow: 0 2px 8px var(--switch-knob-shadow);
      display: grid;
      place-items: center;
      transform: translateX(0);
      transition: transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1), background-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Slide the knob to the right in dark mode */
    :root[data-theme="dark"] .switch-knob {
      transform: translateX(var(--travel));
    }

    .theme-toggle:active .switch-knob {
      width: calc(var(--knob) + 3px);
    }

    /* Sun and moon swap inside the knob */
    .switch-knob svg {
      grid-area: 1 / 1;
      width: 13px;
      height: 13px;
      stroke-width: 2.2;
      stroke: var(--switch-icon);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .switch-knob .icon-moon {
      opacity: 0;
      transform: rotate(-60deg) scale(0.6);
    }

    .switch-knob .icon-sun {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    :root[data-theme="dark"] .switch-knob .icon-sun {
      opacity: 0;
      transform: rotate(90deg) scale(0.6);
    }

    :root[data-theme="dark"] .switch-knob .icon-moon {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    @media (max-width: 479px) {
      .switch-track { --w: 46px; --knob: 20px; height: 26px; }
      .seen-stats { display: none !important; }
      .btn-tool { height: 26px; padding: 0 7px; font-size: 11px; }
      .btn-icon-only { width: 26px; padding: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .switch-knob, .switch-knob svg, .switch-track { transition: none !important; }
    }

    /* Column header row: sticky beneath title bar (top set by JS) */
    .vocab .header-row th {
      position: sticky;
      top: var(--title-h);
      z-index: 10;
      padding: 12px 16px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: left;
      border-bottom: 1px solid var(--line-strong);
      white-space: nowrap;
    }

    th.col-no { width: 12%; text-align: center; }
    th.col-hi { width: 36%; }
    th.col-en { width: 34%; }
    th.col-rating { width: 18%; }

    /* Body cells */
    .vocab tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      transition: background-color 0.15s ease;
    }

    .vocab tbody tr:last-child td {
      border-bottom: none;
    }

    .vocab tbody tr:nth-child(even) td {
      background: var(--zebra);
    }

    .vocab tbody tr:hover td {
      background: var(--hover);
    }

    td.cell-no {
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    td.cell-hi {
      font-family: var(--font-hi);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    td.cell-en {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    /* Frequency rating: number plus a small meter */
    td.cell-rating {
      text-align: left;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rating-value {
      min-width: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .meter {
      position: relative;
      flex: 1;
      max-width: 96px;
      height: 6px;
      border-radius: 999px;
      background: var(--meter-track);
      overflow: hidden;
    }

    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--v, 0%);
      border-radius: inherit;
      background: var(--meter-fill);
    }

    /* Status states */
    .status-msg td {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      border-bottom: none;
    }

    .status-msg.is-error td {
      color: var(--accent);
    }

    /* ---------- Small screens: tighten, keep same structure ---------- */
    @media (max-width: 479px) {
      .vocab .title-row th { padding: 0 14px; }
      .vocab .header-row th { padding: 10px 10px; font-size: 11px; }
      .vocab tbody td { padding: 10px 10px; }
      td.cell-hi { font-size: 16px; }
      td.cell-no { font-size: 12px; }
      .title-row .count { display: none; }
      .meter { max-width: 56px; }
      th.col-rating { width: 22%; }
    }

    /* ---------- Motion preferences ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <main class="page">
    <table class="vocab" aria-describedby="vocab-caption">
      <thead>
        <tr class="title-row">
          <th colspan="4" scope="colgroup" id="mainTitle">
            <div class="title-inner">
              <span>Hindi Vocab</span>
              <div class="title-meta">
                <span class="count" id="vocabCount" aria-live="polite"></span>
                <span class="seen-stats" id="seenCount" aria-live="polite" title="Words marked as seen"></span>
                <div class="title-tools">
                  <button type="button" class="btn-tool" id="toggleHiBtn" aria-pressed="false" title="Hide or show Hindi column">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>Hindi</span>
                  </button>
                  <button type="button" class="btn-tool" id="toggleEnBtn" aria-pressed="false" title="Hide or show English column">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>English</span>
                  </button>
                </div>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
                  <span class="switch-track" aria-hidden="true">
                    <span class="switch-knob">
                      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </span>
                  </span>
                </button>
                <button type="button" class="btn-tool btn-icon-only" id="clearSeenBtn" aria-label="Clear seen words history" title="Clear seen words">
                  <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </div>
          </th>
        </tr>
        <tr class="header-row">
          <th scope="col" class="col-no">No</th>
          <th scope="col" class="col-hi">Hindi Word</th>
          <th scope="col" class="col-en">English Word</th>
          <th scope="col" class="col-rating">Freq. Rating</th>
        </tr>
      </thead>
      <tbody id="vocabBody">
        <tr class="status-msg">
          <td colspan="4">Loading vocabulary…</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    (() => {
      'use strict';

      // Frequency curve: one-minus-exponential model over rank 1..N
      const N = 4800;
      const K = 2.0;
      const DENOM = 1.0 - Math.exp(-K);

      const titleEl = document.getElementById('mainTitle');
      const bodyEl = document.getElementById('vocabBody');
      const countEl = document.getElementById('vocabCount');
      const seenCountEl = document.getElementById('seenCount');
      const themeToggleBtn = document.getElementById('themeToggle');
      const toggleHiBtn = document.getElementById('toggleHiBtn');
      const toggleEnBtn = document.getElementById('toggleEnBtn');
      const clearSeenBtn = document.getElementById('clearSeenBtn');
      const root = document.documentElement;

      const STORAGE_THEME_KEY = 'hindi-vocab-theme';
      const STORAGE_SEEN_KEY = 'hindi-vocab-seen';
      const STORAGE_HIDE_HI_KEY = 'hindi-vocab-hide-hi';
      const STORAGE_HIDE_EN_KEY = 'hindi-vocab-hide-en';
      const DEFAULT_THEME = 'light';

      // --- Theme logic ---
      function getStoredTheme() {
        try {
          const stored = localStorage.getItem(STORAGE_THEME_KEY);
          return stored === 'dark' || stored === 'light' ? stored : null;
        } catch (_) {
          return null;
        }
      }

      function getEffectiveTheme() {
        return root.getAttribute('data-theme') || getStoredTheme() || DEFAULT_THEME;
      }

      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        const isDark = theme === 'dark';
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeToggleBtn.setAttribute('aria-pressed', String(isDark));
        themeToggleBtn.setAttribute('aria-label', label);
        themeToggleBtn.setAttribute('title', label);
      }

      applyTheme(getStoredTheme() || DEFAULT_THEME);

      themeToggleBtn.addEventListener('click', () => {
        const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
        try {
          localStorage.setItem(STORAGE_THEME_KEY, next);
        } catch (_) {}
        applyTheme(next);
      });

      // --- Column visibility toggles (Hindi / English) ---
      function initColumnToggles() {
        let hideHi = false;
        let hideEn = false;
        try {
          hideHi = localStorage.getItem(STORAGE_HIDE_HI_KEY) === 'true';
          hideEn = localStorage.getItem(STORAGE_HIDE_EN_KEY) === 'true';
        } catch (_) {}

        function updateColumnVisibility(col, hidden) {
          if (col === 'hi') {
            root.setAttribute('data-hide-hi', String(hidden));
            toggleHiBtn.classList.toggle('is-hidden', hidden);
            toggleHiBtn.setAttribute('aria-pressed', String(hidden));
            toggleHiBtn.title = hidden ? 'Show Hindi column' : 'Hide Hindi column';
            try { localStorage.setItem(STORAGE_HIDE_HI_KEY, String(hidden)); } catch (_) {}
          } else if (col === 'en') {
            root.setAttribute('data-hide-en', String(hidden));
            toggleEnBtn.classList.toggle('is-hidden', hidden);
            toggleEnBtn.setAttribute('aria-pressed', String(hidden));
            toggleEnBtn.title = hidden ? 'Show English column' : 'Hide English column';
            try { localStorage.setItem(STORAGE_HIDE_EN_KEY, String(hidden)); } catch (_) {}
          }
        }

        updateColumnVisibility('hi', hideHi);
        updateColumnVisibility('en', hideEn);

        toggleHiBtn.addEventListener('click', () => {
          const current = root.getAttribute('data-hide-hi') === 'true';
          updateColumnVisibility('hi', !current);
        });

        toggleEnBtn.addEventListener('click', () => {
          const current = root.getAttribute('data-hide-en') === 'true';
          updateColumnVisibility('en', !current);
        });
      }

      initColumnToggles();

      // --- Seen / Selection logic with LocalStorage ---
      let seenSet = new Set();
      function loadSeenSet() {
        try {
          const raw = localStorage.getItem(STORAGE_SEEN_KEY);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) {
              seenSet = new Set(arr.map(String));
            }
          }
        } catch (_) {
          seenSet = new Set();
        }
      }

      function persistSeenSet() {
        try {
          localStorage.setItem(STORAGE_SEEN_KEY, JSON.stringify(Array.from(seenSet)));
        } catch (_) {}
      }

      loadSeenSet();

      function updateSeenCount() {
        if (!seenCountEl) return;
        const count = seenSet.size;
        if (count > 0) {
          seenCountEl.textContent = `• ${count} seen`;
          seenCountEl.style.display = '';
        } else {
          seenCountEl.textContent = '';
          seenCountEl.style.display = 'none';
        }
      }

      clearSeenBtn.addEventListener('click', () => {
        if (seenSet.size === 0) return;
        if (!confirm('Clear all marked seen words?')) return;
        seenSet.clear();
        try {
          localStorage.removeItem(STORAGE_SEEN_KEY);
        } catch (_) {}
        const rows = bodyEl.querySelectorAll('tr[data-id]');
        rows.forEach((row) => row.classList.remove('is-seen'));
        updateSeenCount();
      });

      // Row selection / toggle delegation
      bodyEl.addEventListener('click', (event) => {
        // Ignore if user was highlighting / selecting text
        const sel = window.getSelection();
        if (sel && sel.toString().trim().length > 0) return;

        const row = event.target.closest('tr[data-id]');
        if (!row) return;

        const id = String(row.getAttribute('data-id'));
        if (seenSet.has(id)) {
          seenSet.delete(id);
          row.classList.remove('is-seen');
        } else {
          seenSet.add(id);
          row.classList.add('is-seen');
        }
        persistSeenSet();
        updateSeenCount();
      });

      function computeFreqRating(rank) {
        if (rank <= 1) return 5.0;
        if (rank >= N) return 1.0;
        const u = (rank - 1) / (N - 1);
        const raw = 1.0 + 4.0 * (1.0 - Math.exp(-K * (1.0 - u))) / DENOM;
        return Math.max(1.0, Math.min(5.0, Math.round(raw * 10) / 10));
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Keep the column header pinned exactly under the title bar
      function syncTitleHeight() {
        const h = titleEl.parentElement.offsetHeight;
        if (h) root.style.setProperty('--title-h', h + 'px');
      }

      if ('ResizeObserver' in window) {
        new ResizeObserver(syncTitleHeight).observe(titleEl.parentElement);
      } else {
        window.addEventListener('resize', syncTitleHeight);
      }
      syncTitleHeight();

      function renderRows(items) {
        const html = items.map((item) => {
          const idStr = String(item.id);
          const isSeen = seenSet.has(idStr);
          const rating = computeFreqRating(Number(item.id));
          const pct = ((rating - 1) / 4) * 100;
          return `
            <tr data-id="${escapeHtml(idStr)}" class="${isSeen ? 'is-seen' : ''}">
              <td class="cell-no">${escapeHtml(item.id)}</td>
              <td class="cell-hi" lang="hi">${escapeHtml(item.hi)}</td>
              <td class="cell-en">${escapeHtml(item.en)}</td>
              <td class="cell-rating">
                <div class="rating">
                  <span class="rating-value">${rating.toFixed(1)}</span>
                  <span class="meter" aria-hidden="true">
                    <span class="meter-fill" style="--v: ${pct.toFixed(1)}%"></span>
                  </span>
                </div>
              </td>
            </tr>`;
        }).join('');

        bodyEl.innerHTML = html;
        countEl.textContent = items.length + (items.length === 1 ? ' word' : ' words');
        updateSeenCount();
        syncTitleHeight();
      }

      function renderStatus(message, isError) {
        bodyEl.innerHTML = `
          <tr class="status-msg${isError ? ' is-error' : ''}">
            <td colspan="4">${escapeHtml(message)}</td>
          </tr>`;
      }

      fetch('./vocab.json', { cache: 'no-cache' })
        .then((res) => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then((data) => {
          if (!Array.isArray(data) || data.length === 0) {
            renderStatus('No vocabulary entries found.', false);
            return;
          }
          renderRows(data);
        })
        .catch((err) => {
          renderStatus('Could not load vocabulary: ' + err.message, true);
        });
    })();
  </script>
</body>
</html>
